name: Prepare Check Toolchain
description: Install the pinned Node/pnpm toolchain, with Rust and just for server and generated documentation checks.
inputs:
  rust:
    description: Prepare Rust and just.
    default: 'true'
  target-dir:
    description: Cargo target directory to cache.
    default: target
runs:
  using: composite
  steps:
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version-file: .node-version
    - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      with:
        version: 11.17.0
    - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      if: inputs.rust == 'true'
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          ~/.cargo/bin/just
          ${{ inputs.target-dir }}
        key: ${{ runner.os }}-rust-${{ inputs.target-dir }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-just-1.58.0
    - name: Prepare Rust and just
      if: inputs.rust == 'true'
      shell: bash
      run: |
        rustup show
        if ! command -v just >/dev/null || [ "$(just --version)" != 'just 1.58.0' ]; then
          cargo install just --version 1.58.0 --locked --force
        fi
    - shell: bash
      run: pnpm install --frozen-lockfile
