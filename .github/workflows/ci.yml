name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_e2e:
        description: Run the complete browser journey at a milestone
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      docs: ${{ steps.scope.outputs.docs }}
      backend: ${{ steps.scope.outputs.backend }}
      teaching: ${{ steps.scope.outputs.teaching }}
      frontend: ${{ steps.scope.outputs.frontend }}
      desktop: ${{ steps.scope.outputs.desktop }}
      removal: ${{ steps.scope.outputs.removal }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - id: scope
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD_SHA: ${{ github.sha }}
        run: node scripts/ci-change-scope.mjs
  tooling:
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup-checks
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm test:tooling
  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '4'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup-checks
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: pnpm contracts:check
      - run: pnpm boundaries:check
      - run: just test-backend
      - run: node scripts/perf-query-plans.mjs
      - name: Keep the query-plan report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: perf-query-report
          path: .scratch/perf/query-plans.json
          if-no-files-found: ignore
          retention-days: 7
  teaching-backend:
    needs: changes
    if: needs.changes.outputs.teaching == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '4'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup-checks
      - run: cargo fmt --all -- --check
      - run: pnpm tutorial:check
      - run: pnpm tutorial:course:check
  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup-checks
        with:
          rust: ${{ github.event_name == 'workflow_dispatch' && inputs.run_e2e && 'true' || 'false' }}
      - run: pnpm typecheck
      - run: pnpm test:frontend
      - run: pnpm build
      - run: node scripts/perf-bundle.mjs
      - run: pnpm exec playwright install --with-deps chromium
        if: github.event_name == 'workflow_dispatch' && inputs.run_e2e
      - run: pnpm test:e2e
        if: github.event_name == 'workflow_dispatch' && inputs.run_e2e
      - name: Keep the bundle report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: perf-bundle-report
          path: .scratch/perf/bundle-report.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Keep browser evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: browser-evidence
          path: |
            test-results/summary.json
            test-results/status-ready.png
            test-results/status-*/trace.zip
            test-results/status-*/test-failed-*.png
          if-no-files-found: ignore
          retention-days: 7
  documentation:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '4'
      DOCS_SOURCE_REF: ${{ github.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup-checks
      - run: pnpm docs:check
      - run: pnpm docs:build
        if: github.event_name != 'workflow_dispatch' || !inputs.run_e2e
      - run: pnpm exec playwright install --with-deps chromium
        if: github.event_name == 'workflow_dispatch' && inputs.run_e2e
      - run: just e2e-docs
        if: github.event_name == 'workflow_dispatch' && inputs.run_e2e
      - name: Keep documentation browser evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: docs-browser-evidence
          path: |
            test-results/docs/summary.json
            test-results/docs/landing-*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Keep verified documentation
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: docs-site
          path: apps/docs/.vitepress/dist
          retention-days: 7
  desktop-smoke:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '4'
      # The runner container cannot grant the Chromium user-namespace sandbox.
      DESKTOP_ELECTRON_ARGS: '--no-sandbox --disable-gpu --disable-dev-shm-usage'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup-checks
      - name: Prepare the X server for the shell
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb
      - name: Shell smoke (window lifecycle, shared views, IPC, navigation limits)
        run: just desktop-smoke
      - name: Keep shell smoke logs on failure
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: desktop-smoke-logs
          path: test-results/desktop/
          if-no-files-found: ignore
          retention-days: 7
  example-removal:
    needs: changes
    if: needs.changes.outputs.removal == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_BUILD_JOBS: '4'
      CARGO_TARGET_DIR: /tmp/cargo-target
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup-checks
        with:
          target-dir: /tmp/cargo-target
      - name: Copy the template to a disposable working copy
        run: git clone --quiet . /tmp/template-copy
      - name: Protection — a dirty copy is refused without changes
        working-directory: /tmp/template-copy
        run: |
          printf '\n<!-- a user tweak the tool must not overwrite -->\n' >> README.md
          if node scripts/example-remove.mjs --root /tmp/template-copy >/tmp/refusal.log 2>&1; then
            echo 'the removal must refuse a copy with uncommitted changes' && exit 1
          fi
          grep -q 'uncommitted' /tmp/refusal.log
          git checkout -- README.md
      # Default (knowledge-only) assembly: the shipped product must pass
      # its gate before the scenario re-adds the second example (UI-R5:
      # notes ships unregistered; adding it back is the runnable
      # demonstration of onboarding an example). The clone is content-
      # identical to the tree the backend job gates, so the Rust core and
      # docs builds are not repeated here — the frontend composition gates
      # are, matching the knowledge-only gate below.
      - name: Default assembly passes its gate
        working-directory: /tmp/template-copy
        run: |
          pnpm typecheck
          pnpm test:frontend
          pnpm --filter @saas/web build
          pnpm boundaries:check
      - name: Add the notes example back
        run: node scripts/example-add.mjs --root /tmp/template-copy --example notes
      - name: Commit the re-add (the removal tool only edits clean copies)
        working-directory: /tmp/template-copy
        run: |
          git config user.email combo@example.test
          git config user.name combo
          git add -A
          git commit -q -m "Add the notes example back"
      - name: Dual-example copy passes its gate
        working-directory: /tmp/template-copy
        run: |
          just check-core
          just docs-build
          pnpm typecheck
          pnpm test:frontend
          pnpm --filter @saas/web build
          pnpm boundaries:check
      # Dual → notes-only: the knowledge example leaves, the second
      # example keeps serving through the same shell.
      - name: Remove the knowledge example (fresh-database path)
        run: node scripts/example-remove.mjs --root /tmp/template-copy --trim-migrations
      - name: Notes-only copy passes its gate
        working-directory: /tmp/template-copy
        run: |
          just check-core
          just docs-build
          pnpm typecheck
          pnpm test:frontend
          pnpm --filter @saas/web build
          pnpm boundaries:check
      # Notes-only → core-only: the shell must assemble an empty example
      # set and fall back to the universal home.
      - name: Commit the first removal (the tool only edits clean copies)
        working-directory: /tmp/template-copy
        run: |
          git config user.email combo@example.test
          git config user.name combo
          git add -A
          git commit -q -m "Remove the knowledge example"
      - name: Remove the notes example
        run: node scripts/example-remove.mjs --root /tmp/template-copy --example notes
      - name: Core-only copy passes its gate
        working-directory: /tmp/template-copy
        run: |
          pnpm typecheck
          pnpm test:frontend
          pnpm --filter @saas/web build
          pnpm boundaries:check
      # Knowledge-only: the notes example leaves while knowledge stays.
      # The fresh clone carries notes unregistered (UI-R5), so the removal
      # is preceded by the add — the documented register-then-remove flow.
      - name: Copy for the knowledge-only combination
        run: git clone --quiet . /tmp/knowledge-only-copy
      - name: Register, then remove, the notes example in the second copy
        working-directory: /tmp/knowledge-only-copy
        run: |
          node scripts/example-add.mjs --example notes
          git config user.email combo@example.test
          git config user.name combo
          git add -A
          git commit -q -m "Add the notes example back"
          node scripts/example-remove.mjs --example notes
      - name: Knowledge-only copy passes its gate
        working-directory: /tmp/knowledge-only-copy
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm typecheck
          pnpm test:frontend
          pnpm --filter @saas/web build
          pnpm boundaries:check
      - name: A new business joins through the same public interfaces
        working-directory: /tmp/template-copy
        run: node scripts/example-new-business.mjs --root /tmp/template-copy
  verify:
    if: always()
    needs:
      [
        changes,
        tooling,
        backend,
        teaching-backend,
        frontend,
        documentation,
        desktop-smoke,
        example-removal,
      ]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - env:
          CI_JOB_RESULTS: ${{ toJSON(needs) }}
        run: node scripts/ci-change-scope.mjs --verify
  publish-docs:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.documentation.result == 'success'
    needs: [verify, documentation]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pages: write
    concurrency:
      group: github-pages-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: docs-site
          path: apps/docs/.vitepress/dist
      - name: Publish artifact and verify the matching Pages build
        env:
          DOCS_SOURCE_REF: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-docs.mjs --request-build
