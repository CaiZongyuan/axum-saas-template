[workspace]
members = ["apps/api", "crates/app", "crates/platform"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false

[workspace.dependencies]
axum = { version = "0.8.8", features = ["json"] }
http-body-util = "0.1.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread", "signal", "net", "time", "sync", "process"] }
tower = { version = "0.5.3", features = ["util"] }

tracing = "0.1.44"
uuid = { version = "1.21.0", features = ["v7"] }

sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "migrate", "macros"] }

utoipa = { version = "5.4.0", features = ["axum_extras"] }

tracing-subscriber = { version = "0.3.22", features = ["env-filter", "json"] }
thiserror = "2.0.18"
argon2 = { version = "0.5.3", features = ["std"] }
sha2 = "0.10.9"
hmac = "0.12.1"
hex = "0.4.3"
email_address = { version = "0.2.9", default-features = false }
url = "2.5.8"
futures-util = "0.3.32"

[workspace.lints.rust]
unsafe_code = "forbid"
