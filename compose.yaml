name: axum-saas-template
services:
  rustfs:
    image: rustfs/rustfs:1.0.0@sha256:8cc9801755448b71a786705ce76692c77e14936cccd87cf2fc31842e58f4d1ff
    command: ['rustfs', '/data']
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-saas-local-access}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-saas-local-storage-secret}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_REGION: ${S3_REGION:-us-east-1}
      RUSTFS_CONSOLE_ENABLE: 'false'
    ports:
      - '127.0.0.1:${RUSTFS_PORT:-9000}:9000'
    volumes:
      - rustfs-data:/data
      - rustfs-logs:/logs
    healthcheck:
      test:
        [
          'CMD',
          'curl',
          '--fail',
          '--silent',
          '--head',
          'http://127.0.0.1:9000/health/ready',
        ]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s
  postgres:
    image: postgres:17.11-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_USER: saas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-saas-local}
      POSTGRES_DB: saas
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U saas -d saas']
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  postgres-data:
  rustfs-data:
  rustfs-logs:
