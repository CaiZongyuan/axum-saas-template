<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"
    />
    <title>无法连接到应用</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          'Noto Sans SC',
          sans-serif;
        background: #f6f6f4;
        color: #1f2937;
      }
      main {
        text-align: center;
        max-width: 26rem;
        padding: 2rem;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 0.75rem;
      }
      p {
        margin: 0 0 1.5rem;
        line-height: 1.6;
        color: #4b5563;
      }
      button {
        font: inherit;
        padding: 0.5rem 1.5rem;
        border-radius: 0.5rem;
        border: 1px solid #9ca3af;
        background: #fff;
        cursor: pointer;
      }
      button:hover {
        background: #f3f4f6;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>暂时无法连接到应用</h1>
      <p>
        请确认开发组合正在运行（`just dev`），然后重试。
        会话保留在本机的独立分区中，恢复后无需重新登录。
      </p>
      <button type="button" id="retry">重新连接</button>
      <p id="hint" hidden>壳内桥未就绪，请关闭窗口后重新打开应用。</p>
    </main>
    <script>
      const button = document.getElementById('retry');
      const hint = document.getElementById('hint');
      if (button) {
        button.addEventListener('click', () => {
          if (window.saasDesktop?.retryLoad)
            void window.saasDesktop.retryLoad();
          else if (hint) hint.hidden = false;
        });
      }
    </script>
  </body>
</html>
